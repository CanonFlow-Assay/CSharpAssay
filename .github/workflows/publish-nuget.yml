name: Publish NuGet packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-0.2.0-rc.1 to release both packages
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    name: Qualify and publish 0.2.0-rc.1
    if: >-
      github.ref == 'refs/tags/v0.2.0-rc.1' &&
      inputs.confirm == 'publish-0.2.0-rc.1'
    runs-on: ubuntu-latest
    environment: nuget.org

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 11 RC1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Locked restore
        run: ./eng/restore.sh

      - name: Release build
        run: dotnet build CSharpAssay.slnx --no-restore --no-incremental --configuration Release

      - name: Complete serialized test suite
        run: >-
          dotnet test CSharpAssay.slnx
          --no-build
          --no-restore
          --configuration Release
          --max-parallel-test-modules 1

      - name: Authoritative self-verification
        run: >-
          dotnet src/CsAssay.Runner/bin/Release/net11.0/cs-assay.dll
          verify CSharpAssay.slnx
          --profile native
          --json artifacts/release/csassay.json
          --sarif artifacts/release/csassay.sarif

      - name: Reproducible pack and fresh-install qualification
        run: |
          ./eng/pack-release.sh
          ./eng/qualify-packages.sh

      - name: Attest tested package bytes
        uses: actions/attest@v4
        with:
          subject-path: artifacts/packages/*.nupkg

      - name: Exchange GitHub OIDC token for temporary NuGet key
        id: login
        uses: NuGet/login@v1
        with:
          # NuGet usernames are public profile identifiers, not credentials.
          user: arun6202

      - name: Publish analyzer and tool packages
        run: |
          dotnet nuget push artifacts/packages/CsAssay.Analyzers.0.2.0-rc.1.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
          dotnet nuget push artifacts/packages/CsAssay.Tool.0.2.0-rc.1.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Upload release evidence
        if: always() && hashFiles('artifacts/**/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: csharp-assay-nuget-0.2.0-rc.1
          path: |
            artifacts/packages/
            artifacts/release/
          if-no-files-found: error
          retention-days: 30
