name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.301
    - name: Locked restore
      run: dotnet restore CSharpAssay.slnx --locked-mode
    - name: Release build
      run: dotnet build CSharpAssay.slnx --no-restore --configuration Release
    - name: Release tests
      run: >-
        dotnet test CSharpAssay.slnx
        --no-build
        --no-restore
        --configuration Release
        --max-parallel-test-modules 1
