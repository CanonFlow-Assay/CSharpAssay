name: CSharpAssay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: .NET 11 RC1 release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 11 RC1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Locked restore
        run: ./eng/restore.sh

      - name: Release build
        run: dotnet build CSharpAssay.slnx --no-restore --configuration Release

      - name: Release tests
        run: >-
          dotnet test CSharpAssay.slnx
          --no-build
          --no-restore
          --configuration Release
          --max-parallel-test-modules 1

      - name: Authoritative self-verification
        run: >-
          dotnet src/CsAssay.Runner/bin/Release/net11.0/cs-assay.dll
          verify CSharpAssay.slnx
          --profile native
          --json artifacts/evidence/csassay.json
          --sarif artifacts/evidence/csassay.sarif

      - name: Reproducible packages and provenance
        run: ./eng/pack-release.sh

      - name: Fresh package installation qualification
        run: ./eng/qualify-packages.sh

      - name: Upload SARIF
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/evidence/csassay.sarif
          category: csharp-assay-native

      - name: Attest release package provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: artifacts/packages/*.nupkg

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: csharp-assay-release-evidence
          path: |
            artifacts/evidence/csassay.json
            artifacts/evidence/csassay.sarif
            artifacts/packages/*.nupkg
            artifacts/packages/checksums.sha256
            artifacts/packages/provenance.json
          if-no-files-found: error
          retention-days: 14
